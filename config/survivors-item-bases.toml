# Restart the game after edits. Base/ordinary rarity weights are relative; legendary is a base percentage.
# First choose loot class (80% player, 20% another class), then rarity, compatible base and affixes.
# White: 1-2 affixes (1 prefix/1 suffix max). Green: 2-4 (2/2). Epic/legendary: 4-6 (3/3).
# An item cannot roll two affixes in the same group. Legendary items also keep one saved unique effect.
# Rarity weights are modified by Ilvl and equipped Magic Find, without changing affix rolls.
# All 21 family variants unlock at levels 1, 3, 6, 9, ... 60. Each family keeps one shared drop weight.
# Tier intrinsic values are at their unlock level, then scale only by 1.015^(Ilvl-unlock).
# Affixes retain their independent Ilvl scaling. Boss loot follows zone tier and boss order.
# Stamina: 1 life/point. Strength/agility: 1% attack damage/point for eligible classes. Intelligence: 1% spell damage/healing/point.
version = 1
boss_drop_chance = 1.0

# Les bases sont classees par emplacement, puis par type. Ajouter les variantes sous le groupe concerne.

