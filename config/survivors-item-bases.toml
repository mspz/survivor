# Restart the game after edits. Base and rarity weights are relative; 0 disables an entry.
# First choose loot class (80% player, 20% another class), then rarity, compatible base and affixes.
# Common: 1 primary. Uncommon: 1 primary + 1 secondary. Epic: stamina + 1 other primary + 2 secondary.
# An item cannot roll two affixes in the same group. Legendary is reserved: weight must be 0.
# Stamina: 1 life/point. Strength/agility: 1% attack damage/point for eligible classes. Intelligence: 1% spell damage/healing/point.
version = 1
boss_drop_chance = 1.0

