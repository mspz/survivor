# Shared by campaign expeditions, Endless and all dungeons. Restart after edits.
version = 1
monster_ground_damage_multiplier = 1.5 # 150% damage for monster-only ground pressure mods.

[ranged]
chance = 0.02
range = 20.0
stand_off = 16.0
interval = 3.0
windup = 1.0

# Modifier effects shared by melee, casters and bosses.
# Distribution and weights live in survivors-monster-mods.toml.
[elites]
health_multiplier = 2.5
size_multiplier = 1.25
# Additional reduction after zone, armour and elemental defenses: 0.2 = 20%.
damage_reduction = 0.0
xp_multiplier = 3

[sprinters]
speed_multiplier = 1.5
# Health, armour, resistances, damage, size and XP stay identical to normal monsters.

[explosives]
radius = 3.5 # yards; the warning matches the damage footprint.
delay = 1.5 # seconds after death, with a filling orange ground circle.
damage_multiplier = 2.0 # relative to this monster's scaled attack damage.

[healers]
radius = 10.0
interval = 4.0 # seconds between pulses.
heal_fraction = 0.1 # fraction of each ally's maximum HP; never heals itself or bosses.

[protectors]
radius = 8.0
damage_reduction = 0.25 # additional reduction; overlapping auras never stack.
# The aura excludes its source, bosses and training actors.

# Permanent stat mods. "taken" fields are independent damage multipliers:
# 0.8 = 20% less damage, multiplied AFTER armour and resistances, including DoTs.
[stats]
action_speed = 1.4
physical_damage = 1.4
added_elemental = 0.35
dot_damage = 1.75
critical_chance = 0.15
critical_multiplier = 0.75
projectiles = 2
chains = 2
area = 1.75
range = 1.4
physical_taken = 0.8
elemental_taken = 0.8
control_duration = 0.5
slow_effect = 0.5
regeneration = 0.05
life_leech = 0.05
aura_radius = 10.0
aura_action_speed = 1.2
oppression = 0.15

