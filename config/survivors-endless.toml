# Monster variants and caster settings: survivors-monster-mod-effects.toml (shared; restart after edits).
# Endless starts at map 0. Rewards add per completed map: +60% gold, +30% XP.
# Monster and boss level: 60 + completed maps (60, 61, 62, ...), including casters.
version = 1
initial_seconds = 360.0
shorter_per_map = 60.0
minimum_seconds = 60.0
movement_per_map = 1.2
# 5.0 = 500% of base monster movement speed, including bosses.
maximum_movement_multiplier = 5.0
monster_stats_per_map = 1.2
boss_stats_per_map = 1.3
boss_cooldown_per_map = 0.8
minimum_boss_cooldown = 1.0
safe_time_per_map = 0.8
reward_per_map = 0.3
gold_per_map = 0.6

[combat]
# Applies to melee, casters and bosses: 1 + rate * (actual monster level - 1).
health_per_level = 0.02
damage_per_level = 0.02
version = 1
end_multiplier = 3.0
multiplayer_health_per_extra_player = 2
monster_armour_per_level = 100
boss_armour_per_level = 10.0
monster_health = 300.0
monster_damage = 80
boss_health = 5000.0
boss_damage = 500.0
population_start = 18
population_end = 280
max_monsters = 450

# Shared by every map while playing Endless.
[combat.zone]
damage_reduction = 0.90
monster_quantity = 1.0
monster_health = 10
monster_damage = 10
boss_quantity = 1
boss_health = 30
boss_damage = 15

[combat.monster_resistance_per_level]
fire = 1.5
cold = 1.5
lightning = 1.5
nature = 1.5
arcane = 1.5
holy = 1.5
shadow = 1.5

[combat.boss_resistance_per_level]
fire = 1.5
cold = 1.5
lightning = 1.5
nature = 1.5
arcane = 1.5
holy = 1.5
shadow = 1.5
