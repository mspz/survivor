# Shared by campaign expeditions, Endless and all dungeons. Restart after edits.
version = 1

[ranged]
chance = 0.02
range = 20.0
stand_off = 16.0
interval = 3.0
windup = 1.0

# Modifier effects shared by melee, casters and bosses.
# Distribution and weights live in survivors-monster-mods.toml.
[elites]
health_multiplier = 10.0
size_multiplier = 1.5
# Additional reduction after zone, armour and elemental defenses: 0.2 = 20%.
damage_reduction = 0.2
xp_multiplier = 3

[sprinters]
speed_multiplier = 2.0
# Health, armour, resistances, damage, size and XP stay identical to normal monsters.

[explosives]
radius = 3.5 # yards; the warning matches the damage footprint.
delay = 1.5 # seconds after death, with a filling orange ground circle.
damage_multiplier = 2.0 # relative to this monster's scaled attack damage.

[healers]
radius = 10.0
interval = 4.0 # seconds between pulses.
heal_fraction = 0.1 # fraction of each ally's maximum HP; never heals itself or bosses.

[protectors]
radius = 8.0
damage_reduction = 0.25 # additional reduction; overlapping auras never stack.
# The aura excludes its source, bosses and training actors.
