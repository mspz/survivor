# Restart the game after edits. Secondary percentages are fractions: 0.10 = 10%.
# Exception: elemental resistances use whole percentage points (8 = +8%), stacking up to 75% effective resistance.
# Primary stats use whole points. Zero weight disables an affix.
# Roll maxima: normal x1, magic x1.25, epic x1.5, future legendary x2; minima stay fixed.
# Relative weights within each eligible prefix/suffix pool: 24 staple, 20 common, 16 standard, 12 specialized, 8 rare.
# Maximum weight ratio is 3:1. Attributes stay common; individual resistances are 20, all resistances 8.
# Offense = prefixes; defense, attributes and utility = suffixes.
# slots controls compatible slots; tags requires ALL listed tags; group prevents duplicates.

[[affixes]]
id = "increased_spell_damage"
name = "Sorcerous"
kind = "prefix"
group = "increased_spell_damage"
effect = "spell_damage_percent"
min = 0.05
max = 0.15
weight = 20
tags = ["spell", "damage"]
slots = ["head","neck","shoulders","back","chest","wrists","hands","waist","legs","feet","ring","trinket","main_hand","off_hand","ranged"]

