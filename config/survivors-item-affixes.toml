# A proc consumes one affix. Only one member of this group can roll on each trinket.
# min/max are its on-hit chance; power and timings belong to the proc payload.
[[affixes]]
id = "proc_damage"
name = "of Surging Power"
kind = "suffix"
group = "trinket_proc"
effect = "proc"
min = 0.08
max = 0.12
weight = 4
slots = ["trinket"]
proc = { kind = "damage", cooldown = 10, duration = 5, power = 0.25 }

