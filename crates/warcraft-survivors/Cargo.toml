[package]
name = "warcraft-survivors"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Warcraft Survivors: solo and native cooperative survival on the benilla world"

[lints]
workspace = true

[features]
default = ["dev"]
dev = ["benilla-app/dev"]
# Per-system timing, for `warcraft-survivors-perf.exe`: costs about 2 ms of CPU per frame even idle.
system_spans = ["benilla-app/system_spans"]

[dependencies]
benilla-app = { path = "../benilla-app", default-features = false }
clap.workspace = true

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "warcraft-survivors"
path = "src/main.rs"
test = false
